<!-- manifest 인라인 -->
<script>
const manifestData = {
  name: "환생 RPG",
  short_name: "환생 RPG",
  description: "죽어도 다시 태어나는 환생 RPG",
  start_url: ".",
  display: "standalone",
  background_color: "#f5f5f0",
  theme_color: "#1a1a2e",
  orientation: "portrait",
  icons: [
    { src: "assets/extracted/asset_02.png", sizes: "192x192", type: "image/png" }
  ]
};
const blob = new Blob([JSON.stringify(manifestData)], {type:'application/json'});
const url = URL.createObjectURL(blob);
const link = document.createElement('link');
link.rel = 'manifest'; link.href = url;
document.currentScript.after(link);
</script>
<style>

    20%  { background-position: -70px 0px; }

    20%  { background-position: -120px 0px; }

  @media (max-height: 680px) {
    #ui-wrap { padding-top:calc(6px + env(safe-area-inset-top)); padding-bottom:calc(6px + env(safe-area-inset-bottom)); }
    #battle-stage { padding:2px 0; }
    #log { height:clamp(150px, 34dvh, 240px); }

  @media (hover: none) and (pointer: coarse) {
    #game { background-attachment: scroll; }
  }
</style>
</head>

<script src="assets/balance_data.js"></script>
<script>
const BALANCE = window.GAME_BALANCE;
if (!BALANCE) throw new Error('assets/balance_data.js failed to load');
const { RACES, MONSTERS, TRAITS, BOSSES } = BALANCE;
const MAX_REST = BALANCE.MAX_REST;
const DEV_MODE = true;

function pickMonster(playerLevel) {
  const maxTier = Math.min(10, Math.max(1, Math.floor(playerLevel * 0.8) + rand(0, 2)));
  const pool = MONSTERS.filter(m => m.tier <= maxTier);
  return pool[rand(0, pool.length - 1)];
}

const MOB_SPRITE_SRC = 'assets/extracted/mob_sprite.png';
const MOB_IMG = new Image();
MOB_IMG.src = MOB_SPRITE_SRC;

function hasTrait(id) {
  return state.traits.some(t => t.id === id);
}

function showTraitPopup(trait) {
  document.getElementById('popup-trait-icon').textContent = trait.icon;
  document.getElementById('popup-trait-name').textContent = trait.name;
  document.getElementById('popup-trait-desc').textContent = trait.desc;
  const overlay = document.getElementById('trait-popup-overlay');
  overlay.style.display = 'flex';
  // 팝업 애니메이션 재실행
  const popup = document.getElementById('trait-popup');
  popup.style.animation = 'none';
  void popup.offsetWidth;
  popup.style.animation = 'popupIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275) forwards';
}

function closeTraitPopup() {
  document.getElementById('trait-popup-overlay').style.display = 'none';
}

function pickTrait() {
  return TRAITS[rand(0, TRAITS.length - 1)];
}

let state = { raceIdx:0, level:1, hp:30, maxHp:30, atk:10, xp:0, xpNext:30, reborn:0, dead:false, bossOnly:false, restLeft:MAX_REST, bossStage:0, hpFloor:false, traits:[], undyingUsed:false, cleared:false };
let combat = null; // 현재 전투 상태
let combatSeq = 0;

function beginCombat(nextCombat) {
  combat = { ...nextCombat, token: ++combatSeq };
  return combat;
}

function isCombatActive(token) {
  return !!combat && combat.token === token;
}

function scheduleCombat(delay, token, fn) {
  return setTimeout(() => {
    if (isCombatActive(token)) fn();
  }, delay);
}

function setCombatButtonsDisabled(disabled, token) {
  if (token && !isCombatActive(token)) return;
  document.querySelectorAll('#combat-actions button').forEach(b => { b.disabled = disabled; });
  if (!disabled) updateSkillBtn();
}

function updateDevControls() {
  const devControls = document.querySelectorAll('[data-dev-control]');
  devControls.forEach(btn => {
    btn.style.display = DEV_MODE && !state.cleared ? '' : 'none';
    btn.disabled = !DEV_MODE || state.cleared;
  });
  const skipBtn = document.getElementById('btn-debug-skip');
  if (skipBtn) skipBtn.disabled = !DEV_MODE || state.cleared || !!combat || state.bossStage >= BOSSES.length - 1;
  const killBtn = document.getElementById('btn-debug-kill');
  if (killBtn) killBtn.disabled = !DEV_MODE || state.cleared || !!combat || !BOSSES[state.bossStage];
  const killCombatBtn = document.getElementById('btn-debug-kill-combat');
  if (killCombatBtn) {
    killCombatBtn.style.display = DEV_MODE && combat?.isBoss && !state.cleared ? '' : 'none';
    killCombatBtn.disabled = !DEV_MODE || !combat?.isBoss || state.cleared;
  }
}

function getBonusTier(hp, maxHp) {
  const pct = hp / maxHp;
  if (pct <= 0.10) return { label:'사선 돌파!!', mult:3.0, color:'#E24B4A' };
  if (pct <= 0.25) return { label:'위험 보너스!', mult:2.0, color:'#EF9F27' };
  if (pct <= 0.50) return { label:'아슬 보너스', mult:1.5, color:'#BA7517' };
  return null;
}

function scrollBattleLogToBottom() {
  const box = document.getElementById('battle-msg-box');
  if (box) requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
}

function logDivider() {
  const el = document.getElementById('log');
  const p = document.createElement('p');
  p.className = 'divider';
  el.appendChild(p);
  if (!state.showingInfo) while (el.children.length > 17) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
  // 전투 중이면 전투 로그에도 구분선
  if (combat) {
    const bm = document.getElementById('battle-msg');
    if (bm && bm.children.length > 0) {
      const div = document.createElement('span');
      div.className = 'battle-msg-divider';
      bm.appendChild(div);
      scrollBattleLogToBottom();
    }
  }
}

function log(msg, cls='') {
  const el = document.getElementById('log');
  const p = document.createElement('p');
  if(cls) p.className = cls;
  p.textContent = msg;
  el.appendChild(p);
  if (!state.showingInfo) while (el.children.length > 17) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
  // 전투 중이면 battle-msg에도 최근 메시지 표시
  if (combat && msg.trim()) {
    const bm = document.getElementById('battle-msg');
    if (bm) {
      const span = document.createElement('span');
      span.className = 'battle-msg-line';
      span.textContent = msg;
      if (cls === 'danger') span.style.color = '#F09595';
      else if (cls === 'rebirth') span.style.color = '#5DCAA5';
      else if (cls === 'bonus') span.style.color = '#FAC775';
      else if (cls === 'system') span.style.color = '#AFA9EC';
      else if (cls === 'highlight') span.style.color = '#fff';
      bm.appendChild(span);
      while (bm.children.length > 8) bm.removeChild(bm.firstChild);
      scrollBattleLogToBottom();
    }
  }
}

function updateUI() {
  const r = RACES[state.raceIdx];
  document.getElementById('race-icon').textContent = r.icon;
  document.getElementById('race-name-text').textContent = r.name;
  document.getElementById('stat-lv').textContent = state.level;
  document.getElementById('stat-atk').textContent = state.atk;
  document.getElementById('stat-reborn').textContent = state.reborn;
  const tb = document.getElementById('trait-banner');
  if (tb) {
    const validTraits = (state.traits || []).filter(t => t && t.icon);
    if (validTraits.length > 0) {
      tb.style.display = 'flex';
      document.getElementById('trait-icon').textContent = validTraits.map(t=>t.icon).join('');
      document.getElementById('trait-name').textContent = validTraits.map(t=>t.name).join(' / ');
      document.getElementById('trait-desc').textContent = `특성 ${validTraits.length}개 ▾`;
      const tt = document.getElementById('trait-tooltip');
      if (tt) tt.innerHTML = validTraits.map(t =>
        `<div class="tt-row"><span class="tt-icon">${t.icon}</span><span class="tt-name">${t.name}</span><span class="tt-desc">— ${t.desc}</span></div>`
      ).join('');
    } else {
      tb.style.display = 'none';
    }
  }
  const bs = BOSSES[state.bossStage];
  document.getElementById('stat-stage').textContent = bs ? `${bs.icon}${bs.stage}` : '완';
  document.getElementById('hp-text').textContent = state.hp + ' / ' + state.maxHp;
  document.getElementById('xp-text').textContent = state.xp + ' / ' + state.xpNext;

  const hpPct = Math.max(0, state.hp / state.maxHp * 100);
  const hpBar = document.getElementById('hp-bar');
  hpBar.style.width = hpPct + '%';

  const tier = getBonusTier(state.hp, state.maxHp);
  const badge = document.getElementById('bonus-badge');
  if (tier) {
    hpBar.style.background = tier.color;
    badge.style.display = 'inline-block';
    badge.textContent = 'x' + tier.mult + ' 보너스 중';
  } else {
    hpBar.style.background = hpPct > 50 ? '#1D9E75' : '#EF9F27';
    badge.style.display = 'none';
  }

  document.getElementById('xp-bar').style.width = (state.xp / state.xpNext * 100) + '%';

  const restBtn = document.getElementById('btn-rest');
  if (restBtn) {
    restBtn.textContent = `🛌 휴식하기 (${state.restLeft}/${MAX_REST})`;
    restBtn.disabled = state.cleared || state.dead || state.restLeft <= 0;
  }
  const bossBtn = document.getElementById('btn-boss');
  if (bossBtn && bs) {
    bossBtn.textContent = `${bs.icon} ${bs.name} 도전`;
  } else if (bossBtn) {
    bossBtn.textContent = '🏆 클리어 완료';
  }
  const huntBtn = document.getElementById('btn-hunt');
  if (huntBtn) {
    huntBtn.disabled = state.cleared || state.dead || state.hpFloor || state.bossOnly || !!combat;
    huntBtn.textContent = state.cleared ? '🏆 클리어 완료' : state.bossOnly ? '⚔️ 사냥 불가 (사망)' : state.hpFloor ? '⚔️ 사냥 불가 (HP 바닥)' : '⚔️ 사냥하기';
  }
  const restBtnEl = document.getElementById('btn-rest');
  if (restBtnEl) restBtnEl.disabled = state.cleared || state.dead || state.restLeft <= 0 || state.bossOnly;
  if (bossBtn) bossBtn.disabled = state.cleared || state.dead || state.bossOnly || !bs;
  const restartBtn = document.getElementById('btn-restart');
  if (restartBtn && state.cleared) restartBtn.style.display = 'block';
  updateDevControls();
}

function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

// 스테이지별 권장 레벨
const STAGE_REC_LV = [7, 10, 13, 16, 19, 22, 25, 28, 31, 35];

function getStageXpMult() {
  const baseMult = [1.0, 1.2, 1.4, 1.7, 2.0, 2.4, 2.8, 3.3, 3.8, 4.5];
  let mult = baseMult[Math.min(state.bossStage, baseMult.length - 1)];

  // 저레벨 회복 보너스 — 권장 레벨보다 낮을수록 추가 배율
  const recLv = STAGE_REC_LV[Math.min(state.bossStage, STAGE_REC_LV.length - 1)];
  const gap = recLv - state.level;
  if (gap > 0) {
    // 레벨 차이 1당 +10% 추가, 최대 +100%
    const catchUp = Math.min(gap * 0.1, 1.0);
    mult = mult * (1 + catchUp);
    mult = Math.round(mult * 10) / 10;
  }
  return mult;
}

function applyXP(base) {
  const tier = getBonusTier(state.hp, state.maxHp);
  let final = base;

  // 스테이지 + 저레벨 회복 배율 적용
  const stageMult = getStageXpMult();
  const recLv = STAGE_REC_LV[Math.min(state.bossStage, STAGE_REC_LV.length - 1)];
  const gap = recLv - state.level;
  if (stageMult > 1.0) {
    final = Math.floor(final * stageMult);
  }

  if (tier) {
    final = Math.round(final * tier.mult);
    log(`  🔥 ${tier.label} — 경험치 x${tier.mult} → +${final}xp!`, 'bonus');
  } else {
    let note = '';
    if (stageMult > 1.0) note += ` (스테이지 x${stageMult}`;
    if (gap > 0) note += ` +회복보너스`;
    if (note) note += ')';
    log(`  → 경험치 +${final}${note}`);
  }
  if (hasTrait('growth')) {
    final = Math.floor(final * 2.0);
    log(`  🌱 빠른 성장 — 경험치 +100% → 총 ${final}xp`, 'system');
  }
  state.xp += final;
  if (state.xp >= state.xpNext) levelUp();
}

function getEarthDefense() {
  const pct = state.hp / state.maxHp;
  if (pct <= 0.10) return 12;
  if (pct <= 0.25) return 7;
  if (pct <= 0.50) return 3;
  return 0;
}

function calcMyAtk(baseAtk, m) {
  const race = RACES[state.raceIdx];
  let atk = baseAtk;
  if (race.canMagic && m.type === '마법') atk = Math.floor(atk * 1.4);
  if (hasTrait('berserk') && state.hp / state.maxHp <= 0.3) atk = Math.floor(atk * 1.6);
  if (hasTrait('instinct') && m.type === '물리') atk = Math.floor(atk * 1.25);
  if (hasTrait('magic') && m.type === '마법') atk = Math.floor(atk * 1.15);
  const critChance = 0.1 + (hasTrait('lucky') ? 0.15 : 0);
  const isCrit = Math.random() < critChance;
  if (isCrit) { atk *= 2; }
  // 엘프 마법 집중 충전
  if (combat?.elfCharged) { atk *= 3; combat.elfCharged = false; }
  return { atk, isCrit };
}

function applyCurseDamage(dmg) {
  if (!combat?.cursed) return { dmg, cursed: false };
  return { dmg: Math.max(1, Math.floor(dmg * 0.8)), cursed: true };
}

function calcEnemyAtk(m) {
  const race = RACES[state.raceIdx];
  let dmg = Math.max(1, m.atk + rand(0, 4) + Math.floor(state.level * 0.5) - (m.def || 0));
  if (race.physResist && m.type === '물리') dmg = Math.max(1, Math.floor(dmg * 0.6));
  if (race.magicWeak && m.type === '마법') dmg = Math.floor(dmg * 1.5);
  if (race.magicResist && m.type === '마법') { dmg = Math.floor(dmg * 0.6); }
  if (race.earthDefense) dmg = Math.max(1, dmg - getEarthDefense());
  if (hasTrait('instinct') && m.type === '물리') dmg = Math.floor(dmg * 1.1);
  if (hasTrait('guard')) dmg = Math.floor(dmg * (combat?.defending ? 0.8 : 0.9));
  if (combat?.defending) dmg = Math.floor(dmg * 0.4);
  if (combat?.spiritShield) dmg = Math.floor(dmg * 0.4);
  if (combat?.fearTurns > 0) dmg = Math.floor(dmg * 0.8);
  return dmg;
}

function startHunt() {
  if (state.cleared || state.dead || state.bossOnly || combat) return;
  const m = pickMonster(state.level);
  const race = RACES[state.raceIdx];
  const maxEnemyHp = (m.atk * 4) + (m.tier * 8) + state.level * 3;
  const hasFirstStrike = Math.random() < 0.2;
  beginCombat({
    m, maxEnemyHp, enemyHp: maxEnemyHp,
    baseXp: (m.tier * 4) + rand(3, 8) + state.level,
    defending: false, stunned: 0,
    poisonTurns: 0, poisonTick: 0, fearTurns: 0,
    spiritShield: false, spiritShieldTurns: 0,
    elfCharged: false, skillCooldown: 0,
    warnNextTurn: false,
    enemyFirstStrike: hasFirstStrike,
    firstTurn: true,
  });
  const typeIcon = m.type === '물리' ? '⚔️' : '✨';
  logDivider();
  log(`${typeIcon} [${m.type} Tier${m.tier}] ${m.name} 출현! — ${m.desc}`, 'highlight');
  const traitList = hasFirstStrike ? [...m.traits, '선공'] : m.traits;
  log(`  특성: ${traitList.join(', ')}  |  적 HP: ${maxEnemyHp}`, hasFirstStrike ? 'danger' : '');
  log(`  스킬: ${race.skill.icon} ${race.skill.name} — ${race.skill.desc}`, 'system');
  // 선공 몬스터면 첫 턴에 선제 공격
  if (hasFirstStrike) {
    log(`  ⚡ 선공! 이번 턴 적이 먼저 공격한다!`, 'danger');
  }
  setCombatUI(true);
  updateCombatBar();
}

function setCombatUI(active) {
  const showClear = state.cleared && !active;
  document.getElementById('combat-panel').style.display = active ? 'flex' : 'none';
  document.getElementById('idle-panel').style.display  = (!active && !showClear) ? 'flex' : 'none';
  document.getElementById('clear-panel').style.display = showClear ? 'flex' : 'none';
  document.getElementById('combat-actions').style.display = active ? 'grid' : 'none';
  document.getElementById('actions').style.display = (active || showClear) ? 'none' : 'grid';
  updateDevControls();
  if (active) {
    const combatToken = combat.token;
    const race = RACES[state.raceIdx];
    const typeIcon = combat.m.type === '물리' ? '⚔️' : '✨';
    const enemyDisplayName = combat.isBoss
      ? `${combat.boss.icon} ${combat.boss.name}`
      : `${typeIcon} ${combat.m.name}`;
    document.getElementById('combat-enemy-name').textContent = enemyDisplayName;
    // 스프라이트 초기화
    const spReset = document.getElementById('enemy-sprite-anim');
    if (spReset) {
      spReset.classList.remove('sprite-death', 'sprite-hit');
      spReset.style.opacity = '1';
      spReset.style.transform = '';
      spReset.style.filter = '';
    }
    ['attack-effect', 'magic-effect', 'poop-skill-effect'].forEach(id => {
      const effReset = document.getElementById(id);
      if (effReset) {
        effReset.style.display = 'none';
        effReset.style.animation = 'none';
      }
    });
    setCombatButtonsDisabled(false, combatToken);
    // 보스 스프라이트 canvas 애니메이션
    if (window._bossAnim) { cancelAnimationFrame(window._bossAnim); window._bossAnim = null; }
    const spriteData = combat.isBoss ? combat.boss.sprite : null;
    const canvas = document.getElementById('enemy-sprite-anim');
    if (canvas && canvas.getContext) {
      const ctx = canvas.getContext('2d');
      if (spriteData) {
        const bossRef = combat.boss;
        canvas.width = bossRef.spriteCanvasWidth || 80;
        canvas.height = bossRef.spriteCanvasHeight || 100;
        canvas.style.width = bossRef.spriteDisplayWidth || '';
        canvas.style.height = bossRef.spriteDisplayHeight || '';
        canvas.style.animation = bossRef.spriteBreathe ? 'bossBreathe 1.6s ease-in-out infinite' : '';
        const img = new Image();
        img.onload = () => {
          if (!isCombatActive(combatToken)) return;
          let frame = 0;
          let last = 0;
          const CW = canvas.width, CH = canvas.height;
          const FRAMES = bossRef.spriteFrames || 5, INTERVAL = bossRef.spriteInterval || 180;
          const FRAME_SEQUENCE = bossRef.spriteFrameSequence || null;
          const FW = bossRef.spriteFrameWidth || Math.floor(img.width / FRAMES);
          const FH = bossRef.spriteFrameHeight || img.height;
          const CROP_X = bossRef.spriteCropX || 0;
          const CROP_Y = bossRef.spriteCropY || 0;
          const SW = FW - CROP_X * 2;
          const SH = FH - CROP_Y * 2;
          const SCALE = bossRef.spriteScale || Math.min(CW / FW, CH / FH);
          const DW = Math.min(CW, FW * SCALE);
          const DH = Math.min(CH, FH * SCALE);
          const DX = Math.floor((CW - DW) / 2);
          const DY = Math.floor((CH - DH) / 2);
          function draw(ts) {
            if (!isCombatActive(combatToken)) return;
            if (ts - last > INTERVAL) {
              frame = (frame+1) % (FRAME_SEQUENCE ? FRAME_SEQUENCE.length : FRAMES);
              last = ts;
            }
            const sourceFrame = FRAME_SEQUENCE ? FRAME_SEQUENCE[frame] : frame;
            ctx.clearRect(0, 0, CW, CH);
            ctx.drawImage(img, sourceFrame*FW + CROP_X, CROP_Y, SW, SH, DX, DY, DW, DH);
            window._bossAnim = requestAnimationFrame(draw);
          }
          window._bossAnim = requestAnimationFrame(draw);
        };
        img.src = spriteData.startsWith('assets/') || spriteData.startsWith('./') || spriteData.startsWith('/') || spriteData.startsWith('data:')
          ? spriteData
          : 'data:image/png;base64,' + spriteData;
        canvas.style.display = 'block';
      } else {
        // 일반 몬스터 canvas 애니메이션
        canvas.width = 80;
        canvas.height = 100;
        canvas.style.width = '';
        canvas.style.height = '';
        canvas.style.animation = '';
        canvas.style.display = 'block';
        let frame = 0, last = 0;
        const FW = 80, FH = 100, FRAMES = 5, INTERVAL = 180;
        function drawMob(ts) {
          if (!isCombatActive(combatToken)) return;
          if (ts - last > INTERVAL) { frame = (frame+1) % FRAMES; last = ts; }
          ctx.clearRect(0, 0, FW, FH);
          if (MOB_IMG.complete) ctx.drawImage(MOB_IMG, frame*FW, 0, FW, FH, 0, 0, FW, FH);
          window._bossAnim = requestAnimationFrame(drawMob);
        }
        if (MOB_IMG.complete) {
          window._bossAnim = requestAnimationFrame(drawMob);
        } else {
          MOB_IMG.onload = () => {
            if (isCombatActive(combatToken)) window._bossAnim = requestAnimationFrame(drawMob);
          };
        }
      }
    }
    // 플레이어 이모지
    document.getElementById('player-name-battle').textContent = race.name;
    // 플레이어 스프라이트 (현재 테스트용 동일)
    // document.getElementById('player-sprite-anim') — CSS animation 자동 재생
    document.getElementById('player-name-battle').textContent = race.name;
    document.getElementById('battle-msg').innerHTML = '';
    updateSkillBtn();
  }
}

function updateSkillBtn() {
  if (!combat) return;
  const race = RACES[state.raceIdx];
  const btn = document.getElementById('btn-skill');
  if (!btn) return;
  if (combat.skillCooldown > 0) {
    btn.textContent = `⏳ ${race.skill.name} (${combat.skillCooldown}턴)`;
    btn.disabled = true;
  } else {
    btn.textContent = `${race.skill.icon} ${race.skill.name}`;
    btn.disabled = false;
  }
}

function updateCombatBar() {
  if (!combat) return;
  const ePct = Math.max(0, combat.enemyHp / combat.maxEnemyHp * 100);
  document.getElementById('enemy-hp-fill').style.width = ePct + '%';
  document.getElementById('enemy-hp-num').textContent = combat.enemyHp + '/' + combat.maxEnemyHp;
  const pPct = Math.max(0, state.hp / state.maxHp * 100);
  document.getElementById('player-hp-fill').style.width = pPct + '%';
  document.getElementById('player-hp-num').textContent = state.hp + '/' + state.maxHp;
  const warn = document.getElementById('warn-banner');
  warn.style.display = combat.warnNextTurn ? 'block' : 'none';
}

function applyEnemyAttack(isBossTurn, token) {
  if (token && !isCombatActive(token)) return;
  if (!combat) return;
  const race = RACES[state.raceIdx];
  const m = combat.m;

  // 적이 이미 죽어 있으면 반격 없음
  if (combat.enemyHp <= 0) {
    endCombat(true, token); return;
  }

  if (combat.stunned > 0) {
    log(`  💤 적이 비틀거린다... (기절 ${combat.stunned}턴 남음)`);
    combat.stunned--;
  } else if (isBossTurn || combat.isBoss) {
    applyBossAttack();
  } else {
    applyMobAttack();
  }

  // 독 피해 — 적이 살아있을 때만
  if (combat && combat.poisonTurns > 0 && combat.enemyHp > 0) {
    combat.poisonTick++;
    const poisonDmg = Math.floor(combat.maxEnemyHp * combat.poisonTick * 0.05);
    combat.enemyHp = Math.max(0, combat.enemyHp - poisonDmg);
    combat.poisonTurns--;
    log(`  ☠️ 독 피해 ${poisonDmg} (${combat.poisonTick}턴째, 남은 턴: ${combat.poisonTurns})`);
    if (combat.enemyHp <= 0) {
      const poisonToken = combat.token;
      scheduleCombat(400, poisonToken, () => endCombat(true, poisonToken));
      return;
    }
  }
  if (combat.fearTurns > 0) combat.fearTurns--;
  if (combat.spiritShield) {
    combat.spiritShieldTurns--;
    if (combat.spiritShieldTurns <= 0) { combat.spiritShield = false; log(`  🌿 방벽 해제`); }
  }
  if (combat.skillCooldown > 0) {
    combat.skillCooldown--;
    if (combat.skillCooldown === 0) log(`  ✅ 스킬 사용 가능!`, 'system');
  }
  updateSkillBtn();
  updateCombatBar();
  updateUI();

  if (combat.enemyHp <= 0) { endCombat(true, token); return; }
  if (state.hp <= 0) {
    if (hasTrait('undying') && !state.undyingUsed) {
      state.undyingUsed = true;
      state.hp = Math.floor(state.maxHp * 0.3);
      log(`  🛡️ 불굴 발동! HP ${state.hp}로 부활!`, 'rebirth');
      updateCombatBar(); updateUI(); return;
    }
    endCombat(false, token);
  }
}

function applyMobAttack() {
  if (!combat) return;
  const race = RACES[state.raceIdx];
  const m = combat.m;
  const bigAttackWarned = combat.warnNextTurn;
  combat.warnNextTurn = m.tier >= 4 && Math.random() < 0.2;
  let dmg = calcEnemyAtk(m);
  if (bigAttackWarned) dmg = Math.floor(dmg * 2.5);
  if (bigAttackWarned && combat.defending) {
    combat.stunned = 2;
    dmg = Math.floor(dmg * 0.2);
    log(`  🛡️ 강공격 방어 성공! 피해 80%감소 + 적 확정 기절 2턴!`, 'rebirth');
  }
  if (race.canDodge && Math.random() < 0.5) { log(`  💨 회피! 피해 없음`); dmg = 0; }
  if (dmg > 0) {
    state.hp = Math.max(0, state.hp - dmg);
    const defNote = bigAttackWarned && combat.defending ? ' (강공격 방어 80%감소)' : combat.defending ? ' (방어 60%감소)' : '';
    log(`  ${bigAttackWarned ? '💥 강공격!' : '적 공격'} ${dmg}${defNote}  HP ${state.hp}/${state.maxHp}`, bigAttackWarned ? 'danger' : '');
    // 응아 방어 흡수 — 방어 중 50% 확률로 피해만큼 회복
    if (combat.defending && RACES[state.raceIdx].defenseLeech && Math.random() < 0.5) {
      state.hp = Math.min(state.maxHp, state.hp + dmg);
      log(`  💜 방어 흡수! HP +${dmg} 회복`, 'rebirth');
    }
  }
  updateCombatBar();
}

function applyBossAttack() {
  if (!combat) return;
  const race = RACES[state.raceIdx];
  const boss = combat.boss;
  const bossMaxHp = combat.bossMaxHp;
  let bossAtk = boss.atk + rand(0, 10);
  let bossNote = '';
  if (boss.stage === 1 && combat.enemyHp < bossMaxHp * 0.3) { bossAtk = Math.floor(bossAtk * 1.5); bossNote = '🔴광폭화!'; }
  if (boss.stage === 3 && Math.random() < 0.3) { bossAtk = Math.floor(state.maxHp * 0.3); bossNote = '⛰내려찍기!'; }
  if (boss.stage === 4) { bossAtk += Math.floor(state.maxHp * 0.05); bossNote = '🔥화염장판'; }
  if (boss.stage === 5 && Math.random() < 0.4) { combat.cursed = true; bossNote = '🌙저주 걸림!'; }
  if (boss.stage === 6 && Math.random() < 0.3) { combat.stunned = 2; bossNote = '⚡낙뢰 스턴! (2턴)'; }
  if (boss.stage === 7 && Math.random() < 0.4) { combat.frozen = true; bossNote = '❄️다음턴 빙결!'; }
  if (boss.stage === 8) { const l = Math.floor(bossAtk * 0.5); combat.enemyHp = Math.min(bossMaxHp, combat.enemyHp + l); bossNote = `☠️흡혈 +${l}HP`; }
  if (boss.stage === 9 && Math.random() < 0.5) { bossAtk = Math.floor(bossAtk * 1.5); bossNote = '🌌레이저!'; }
  if (boss.stage === 10) {
    // 페이즈 관리
    if (!combat.eclipsePhase) combat.eclipsePhase = 1;
    const hpPct = combat.enemyHp / combat.bossMaxHp;
    const newPhase = hpPct > 0.6 ? 1 : hpPct > 0.3 ? 2 : 3;
    if (newPhase > combat.eclipsePhase) {
      combat.eclipsePhase = newPhase;
      if (newPhase === 2) log(`  🌑 이클립스 퀸의 봉인이 풀린다...!`, 'danger');
      if (newPhase === 3) log(`  💀 종말이 시작된다!!!`, 'danger');
    }
    // Phase 3: 기본 공격력 1.2배
    if (combat.eclipsePhase === 3) bossAtk = Math.floor(bossAtk * 1.2);
    // 특수기 풀 구성
    const eclPool = ['curse', 'lightning_freeze', 'laser'];
    if (combat.eclipsePhase >= 2) eclPool.push('flame');
    if (combat.eclipsePhase === 3) { eclPool.push('vampire'); eclPool.push('mirror'); }
    // 페이즈별 픽 수, 랜덤 선택
    const pickCount = combat.eclipsePhase === 1 ? 1 : 2;
    const chosen = [...eclPool].sort(() => Math.random() - 0.5).slice(0, pickCount);
    for (const s of chosen) {
      if (s === 'curse' && Math.random() < 0.4) { combat.cursed = true; bossNote += ' 🌙저주!'; }
      if (s === 'lightning_freeze') {
        const useFreeze = combat.eclipsePhase >= 2 && Math.random() < 0.5;
        if (useFreeze) { if (Math.random() < 0.4) { combat.frozen = true; bossNote += ' ❄️빙결!'; } }
        else { if (Math.random() < 0.3) { combat.stunned = 2; bossNote += ' ⚡낙뢰!'; } }
      }
      if (s === 'laser' && Math.random() < 0.3) { bossAtk = Math.floor(bossAtk * 1.5); bossNote += ' 🌌레이저!'; }
      if (s === 'flame' && Math.random() < 0.4) {
        const fd = Math.floor(state.maxHp * 0.04);
        state.hp = Math.max(0, state.hp - fd);
        bossNote += ` 🔥화염장판-${fd}`;
      }
      if (s === 'vampire') { combat.eclipseVampire = true; bossNote += ' 🩸흡혈!'; }
      if (s === 'mirror' && Math.random() < 0.3) { combat.eclipseMirrorReady = true; bossNote += ' 👥분신!'; }
    }
  }
  const bigWarned = combat.warnNextTurn;
  combat.warnNextTurn = Math.random() < 0.25;
  if (bigWarned) { bossAtk = Math.floor(bossAtk * 2.5); bossNote = '💥강공격! ' + bossNote; }
  if (bigWarned && combat.defending) {
    combat.stunned = 2;
    bossAtk = Math.floor(bossAtk * 0.2);
    log(`  🛡️ 강공격 방어 성공! 피해 80%감소 + 적 확정 기절 2턴!`, 'rebirth');
  } else if (combat.defending) {
    bossAtk = Math.floor(bossAtk * 0.4);
  }
  if (hasTrait('instinct')) bossAtk = Math.floor(bossAtk * 1.1);
  if (hasTrait('guard')) bossAtk = Math.floor(bossAtk * (combat.defending ? 0.8 : 0.9));
  if (race.physResist) bossAtk = Math.max(1, Math.floor(bossAtk * 0.6));
  if (race.magicResist) bossAtk = Math.max(1, Math.floor(bossAtk * 0.6));
  if (race.earthDefense) bossAtk = Math.max(1, bossAtk - getEarthDefense());
  if (race.canDodge && Math.random() < 0.5) { bossAtk = 0; bossNote += ' 💨회피!'; }
  if (bossNote) log(`  ${bossNote}`, bigWarned ? 'danger' : 'system');
  if (bossAtk > 0) {
    state.hp = Math.max(0, state.hp - bossAtk);
    log(`  보스 공격 ${bossAtk}${combat.defending ? (bigWarned ? ' (강공격 방어 80%감소)' : ' (방어 60%감소)') : ''}  HP ${state.hp}/${state.maxHp}`, state.hp < state.maxHp * 0.3 ? 'danger' : '');
    // 응아 방어 흡수
    if (combat.defending && RACES[state.raceIdx].defenseLeech && Math.random() < 0.5) {
      state.hp = Math.min(state.maxHp, state.hp + bossAtk);
      log(`  💜 방어 흡수! HP +${bossAtk} 회복`, 'rebirth');
    }
    // 이클립스 퀸 흡혈
    if (combat.eclipseVampire) {
      const vHeal = Math.floor(bossAtk * 0.2);
      combat.enemyHp = Math.min(combat.bossMaxHp, combat.enemyHp + vHeal);
      log(`  🩸 종말의 흡혈 — 보스 HP +${vHeal}`, 'system');
      combat.eclipseVampire = false;
    }
  }
}

function combatAction(action) {
  if (!combat || state.dead || combat.comboLock) return;
  const actionToken = combat.token;
  const m = combat.m;
  const race = RACES[state.raceIdx];
  const MAGIC_RACES = ['poop', 'elf'];
  const isMagicAtkFixed = MAGIC_RACES.includes(race.id);
  combat.defending = (action === 'defend');
  // 매 턴 구분선
  const bm = document.getElementById('battle-msg');
  if (bm && bm.children.length > 0) {
    const div = document.createElement('span');
    div.className = 'battle-msg-divider';
    bm.appendChild(div);
    scrollBattleLogToBottom();
  }

  // ── 선공 몬스터: 적이 먼저 ──
  if (combat.enemyFirstStrike && combat.firstTurn) {
    combat.firstTurn = false;
    log(`  ⚡ 적 선공!`, 'danger');
    applyEnemyAttack(false, actionToken);
    if (!isCombatActive(actionToken)) return; // 전투 종료됐으면 중단
    combat.defending = (action === 'defend'); // 방어 상태 재설정
  } else {
    combat.firstTurn = false;
  }
  combat.defending = (action === 'defend');

  if (combat.frozen) {
    combat.frozen = false;
    combat.defending = false;
    log(`  ❄️ 빙결! 행동할 수 없다.`, 'danger');
    updateCombatBar();
    updateUI();
    setCombatButtonsDisabled(true, actionToken);
    scheduleCombat(350, actionToken, () => {
      setCombatButtonsDisabled(false, actionToken);
      applyEnemyAttack(combat.isBoss, actionToken);
    });
    return;
  }

  // ── 내 행동 ──
  if (action === 'attack') {
    const base = state.atk + rand(0, 5);
    const { atk: atkRaw, isCrit } = calcMyAtk(base, m);
    let atk = atkRaw;
    // 보스 사냥꾼 특성
    if (combat.isBoss && hasTrait('bossKill')) atk = Math.floor(atk * 1.5);
    const curseResult = applyCurseDamage(atk);
    atk = curseResult.dmg;
    // 분신 체크 (보스 2: 50% 랜덤 / 보스 10: eclipseMirrorReady 플래그)
    let mirrorDodged = combat.isBoss && combat.boss.stage === 2 && Math.random() < 0.5;
    if (!mirrorDodged && combat.isBoss && combat.boss.stage === 10 && combat.eclipseMirrorReady) {
      combat.eclipseMirrorReady = false;
      mirrorDodged = true;
    }
    if (mirrorDodged) atk = 0;
    combat.enemyHp = Math.max(0, combat.enemyHp - atk);
    // 히트 이펙트
    const sp = document.getElementById('enemy-sprite-anim');
    if (sp) { sp.classList.add('sprite-hit'); scheduleCombat(300, actionToken, () => { sp.classList.remove('sprite-hit'); }); }
    // 공격 이펙트 — 물리/마법 구분
    const effId = isMagicAtkFixed ? 'magic-effect' : 'attack-effect';
    const effAnim = isMagicAtkFixed ? 'magicEffect 0.5s steps(1) forwards' : 'slashEffect 0.5s steps(1) forwards';
    const eff = document.getElementById(effId);
    if (eff) {
      eff.style.display = 'block';
      eff.style.animation = 'none';
      void eff.offsetWidth;
      eff.style.animation = effAnim;
      scheduleCombat(520, actionToken, () => { eff.style.display = 'none'; });
    }
    const eName = combat.isBoss ? combat.boss.name : combat.m.name;
    let msg = mirrorDodged
      ? `  👥 분신! 피해 무효!  ${eName} ${combat.enemyHp}/${combat.maxEnemyHp}`
      : `  ⚔️ 공격 ${atk}${isCrit ? ' 💥치명타!' : ''}${curseResult.cursed ? ' 🌙저주-20%' : ''}  ${eName} ${combat.enemyHp}/${combat.maxEnemyHp}`;
    if (!mirrorDodged && hasTrait('vampire')) {
      const leech = Math.floor(atk * 0.3);
      state.hp = Math.min(state.maxHp, state.hp + leech);
      msg += ` 🩸+${leech}`;
    }
    log(msg);
  } else if (action === 'defend') {
    combat.defending = true;
    log(`  🛡️ 방어 태세`);
  } else if (action === 'skill') {
    if (combat.skillCooldown > 0) {
      log(`  ⏳ 스킬 쿨타임 중 (${combat.skillCooldown}턴 남음)`, 'system');
      return;
    }
    const id = race.id;
    combat.skillCooldown = id === 'spirit' ? 5 : id === 'elf' ? 6 : 3;
    if (id === 'human') {
      let h1 = Math.floor((state.atk + rand(0,5)) * 0.8);
      let h2 = Math.floor((state.atk + rand(0,5)) * 0.8);
      const h1Curse = applyCurseDamage(h1);
      const h2Curse = applyCurseDamage(h2);
      h1 = h1Curse.dmg;
      h2 = h2Curse.dmg;
      const curseNote = h1Curse.cursed ? ' 🌙저주-20%' : '';
      // 슬래시 이펙트 ID 미리 고정 (비동기 중 종족 바뀌어도 유지)
      const slashEffId = 'attack-effect';
      const slashAnim = 'slashEffect 0.5s steps(1) forwards';
      // 연속 공격 중 입력 차단 플래그
      combat.comboLock = true;
      // 1타 즉시 반영
      let mirror1 = combat.isBoss && combat.boss.stage === 2 && Math.random() < 0.5;
      if (!mirror1 && combat.isBoss && combat.boss.stage === 10 && combat.eclipseMirrorReady) {
        combat.eclipseMirrorReady = false;
        mirror1 = true;
      }
      if (mirror1) h1 = 0;
      combat.enemyHp = Math.max(0, combat.enemyHp - h1);
      const eName1 = combat.isBoss ? combat.boss.name : combat.m.name;
      log(mirror1 ? `  👥 1타! 분신 — 피해 무효!  ${eName1} ${combat.enemyHp}/${combat.maxEnemyHp}` : `  ⚔️ 1타! ${h1} 데미지${curseNote}  ${eName1} ${combat.enemyHp}/${combat.maxEnemyHp}`);
      updateCombatBar();
      const sp2 = document.getElementById('enemy-sprite-anim');
      if (sp2) { sp2.classList.add('sprite-hit'); scheduleCombat(250, actionToken, () => sp2.classList.remove('sprite-hit')); }
      const eff1 = document.getElementById(slashEffId);
      if (eff1) { eff1.style.display='block'; eff1.style.animation='none'; void eff1.offsetWidth; eff1.style.animation=slashAnim; scheduleCombat(520, actionToken, () => { eff1.style.display='none'; }); }
      // 1타로 이미 사망 시 즉시 종료
      if (combat.enemyHp <= 0) {
        const spDead = document.getElementById('enemy-sprite-anim');
        if (spDead) { spDead.classList.add('sprite-death'); }
        log(`  💀 ${combat.isBoss ? combat.boss.name : combat.m.name} 쓰러졌다!`, 'rebirth');
        combat.comboLock = false;
        scheduleCombat(600, actionToken, () => endCombat(true, actionToken));
        return;
      }
      // 2타 딜레이 후 반영
      scheduleCombat(400, actionToken, () => {
        const mirror2 = combat.isBoss && combat.boss.stage === 2 && Math.random() < 0.5;
        if (mirror2) h2 = 0;
        combat.enemyHp = Math.max(0, combat.enemyHp - h2);
        const eName2 = combat.isBoss ? combat.boss.name : combat.m.name;
        log(mirror2 ? `  👥 2타! 분신 — 피해 무효!  ${eName2} ${combat.enemyHp}/${combat.maxEnemyHp}` : `  ⚔️ 2타! ${h2} 데미지${curseNote}  ${eName2} ${combat.enemyHp}/${combat.maxEnemyHp}`);
        updateCombatBar();
        if (sp2) { sp2.classList.add('sprite-hit'); scheduleCombat(250, actionToken, () => sp2.classList.remove('sprite-hit')); }
        const eff2 = document.getElementById(slashEffId);
        if (eff2) { eff2.style.display='block'; eff2.style.animation='none'; void eff2.offsetWidth; eff2.style.animation=slashAnim; scheduleCombat(520, actionToken, () => { eff2.style.display='none'; }); }
        combat.comboLock = false;
        if (combat.enemyHp <= 0) {
          endCombat(true, actionToken);
        } else {
          // 2타 완료 후 적 반격
          setCombatButtonsDisabled(true, actionToken);
          scheduleCombat(350, actionToken, () => {
            setCombatButtonsDisabled(false, actionToken);
            applyEnemyAttack(combat.isBoss, actionToken);
          });
        }
      }, 400);
      log(`  ⚔️⚔️ 연속 공격! 총 ${h1+h2} 데미지${curseNote}`);
    } else if (id === 'skeleton') {
      combat.fearTurns = 2;
      log(`  💀 공포! 적 공격력 2턴 20% 감소`, 'system');
    } else if (id === 'poop') {
      if (combat.poisonTurns > 0) {
        log(`  ☠️ 이미 독 상태입니다! (남은 턴: ${combat.poisonTurns})`, 'system');
      } else {
        combat.poisonTurns = 6;
        combat.poisonTick = 0;
        log(`  ☠️ 독액! 6턴 지속 피해 (매 턴 증가)`, 'system');
      }
      const poopEff = document.getElementById('poop-skill-effect');
      if (poopEff) {
        poopEff.style.display = 'block';
        poopEff.style.animation = 'none';
        void poopEff.offsetWidth;
        poopEff.style.animation = 'poopSkillEffect 0.6s steps(1) forwards';
        scheduleCombat(650, actionToken, () => { poopEff.style.display = 'none'; });
      }
    } else if (id === 'spirit') {
      combat.spiritShield = true;
      combat.spiritShieldTurns = 3;
      log(`  🌿 대지 방벽! 3턴 피해 60% 감소`, 'system');
    } else if (id === 'elf') {
      combat.elfCharged = true;
      log(`  🔮 마법 집중 충전! 다음 공격 3배`, 'system');
    }
  }

  // 내 공격 결과 먼저 반영
  updateCombatBar();
  updateUI();

  if (combat.enemyHp <= 0) {
    // 스프라이트 death 애니메이션
    const spDead = document.getElementById('enemy-sprite-anim');
    if (spDead) {
      spDead.classList.remove('sprite-hit');
      spDead.classList.add('sprite-death');
    }
    log(`  💀 ${combat.isBoss ? combat.boss.name : combat.m.name} 쓰러졌다!`, 'rebirth');
    scheduleCombat(600, actionToken, () => {
      if (spDead) { spDead.classList.remove('sprite-death'); spDead.style.opacity='1'; }
      endCombat(true, actionToken);
    });
    return;
  }

  // ── 방어 자세 무너뜨리기 ──
  if (action === 'defend' && Math.random() < 0.2) {
    combat.stunned = 2;
    log(`  💥 자세 무너뜨리기! 2턴 적 행동 불가`, 'rebirth');
  }

  // ── 연속 공격 중이면 적 반격은 2타 완료 후 처리
  if (combat.comboLock) return;

  // ── 적 행동 (딜레이 후) ── 버튼 잠금
  setCombatButtonsDisabled(true, actionToken);
  scheduleCombat(350, actionToken, () => {
    setCombatButtonsDisabled(false, actionToken);
    applyEnemyAttack(combat.isBoss, actionToken);
  });
}

function endCombat(victory, token) {
  if (token && !isCombatActive(token)) return;
  if (!combat) return;
  const m = combat.m;
  const isBoss = combat.isBoss;
  const boss = combat.boss;
  const baseXp = combat.baseXp;
  const race = RACES[state.raceIdx];
  combat = null;
  combatSeq++;
  if (window._bossAnim) { cancelAnimationFrame(window._bossAnim); window._bossAnim = null; }
  setCombatUI(false);
  const skillBtn = document.getElementById('btn-skill');
  if (skillBtn) { skillBtn.disabled = false; }

  if (victory) {
    if (isBoss) {
      log(`🏆 ${boss.name} 격퇴!`, 'rebirth');
      state.hp = state.maxHp;
      log(`  💊 완전 회복!`, 'rebirth');
      applyXP(state.xpNext * 3);
      // 3, 6, 9스테이지 클리어 시 추가 특성 획득
      const clearedStage = state.bossStage;
      if ([2, 5, 8].includes(clearedStage)) {
        const available = TRAITS.filter(t => !hasTrait(t.id));
        if (available.length > 0) {
          const newT = available[rand(0, available.length - 1)];
          state.traits.push(newT);
          log(`  🎁 특성 획득! ${newT.icon} ${newT.name} — ${newT.desc}`, 'rebirth');
          // sturdy/homebody 즉시 적용
          if (newT.id === 'sturdy') { state.maxHp = Math.floor(state.maxHp * 1.5); state.hp = state.maxHp; }
          if (newT.id === 'homebody') { state.restLeft = MAX_REST * 2; }
          // 팝업 연출
          setTimeout(() => showTraitPopup(newT), 400);
        }
      }
      if (state.bossStage < BOSSES.length - 1) {
        state.bossStage++;
        const next = BOSSES[state.bossStage];
        log(`▶ 다음 스테이지: ${next.icon} ${next.area} — ${next.name}`, 'system');
      } else {
        state.cleared = true;
        state.dead = true;
        state.bossOnly = true;
        state.bossStage = BOSSES.length;
        log(`🌟 모든 스테이지 클리어! 전설이 되었다.`, 'rebirth');
        setCombatUI(false);
      }
    } else {
      log(`  ✅ ${m.name} 처치!`, 'rebirth');
      applyXP(baseXp);
      const hpPct = state.hp / state.maxHp;
      if (hpPct <= 0.10) log(`  ☠️ 위험! 보스 도전 시 경험치 x3.0!`, 'danger');
      else if (hpPct <= 0.25) log(`  ⚠️ 보스 도전 시 경험치 x2.0!`, 'danger');
      else if (hpPct <= 0.50) log(`  💡 보스 도전 시 경험치 x1.5`);
    }
  } else {
    if (isBoss) {
      // 보스에게 패배 → 환생
      state.hp = 0;
      updateUI();
      log(boss.deathMsg, 'danger');
      log(boss.deathEffect, 'system');
      setTimeout(() => rebirth(boss), 2200);
      return;
    } else {
      // 일반 사냥 패배 → 게임오버
      log(`☠️ 전투 중 사망!`, 'danger');
      updateUI();
      setTimeout(() => gameOver(race, BOSSES[state.bossStage]), 400);
      return;
    }
  }
  updateUI();
}

function rest() {
  if(state.cleared || state.dead || state.restLeft <= 0) return;
  const race = RACES[state.raceIdx];
  state.restLeft--;
  logDivider();
  if(state.hpFloor) log('  💊 회복 후에도 보스 도전만 가능하다.', 'system');
  if (race.fullRestoreOnce) {
    const healed = state.maxHp - state.hp;
    state.hp = state.maxHp;
    log(`🛌 💩 풀회복 특성 발동! HP +${healed} → 완전 회복! (${state.hp}/${state.maxHp})  남은 휴식 ${state.restLeft}회`, 'rebirth');
  } else {
    const baseHeal = Math.floor(state.maxHp * 0.3);
    const bigRest = Math.random() < 0.2;
    const heal = bigRest ? baseHeal * 3 : baseHeal;
    state.hp = Math.min(state.maxHp, state.hp + heal);
    if (bigRest)
      log(`🛌 ✨ 깊은 휴식! HP +${heal} 회복 (최대HP의 90%). (${state.hp}/${state.maxHp})  남은 휴식 ${state.restLeft}회`, 'rebirth');
    else
      log(`🛌 휴식... HP +${heal} 회복 (최대HP의 30%). (${state.hp}/${state.maxHp})  남은 휴식 ${state.restLeft}회`);
  }
  if(state.restLeft === 0) log('  ⚠️ 휴식 횟수 소진! 보스를 도전해야 초기화된다.', 'danger');
  updateUI();
}

function pulseCard(id, tempText, origText) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = tempText;
  el.style.color = '#EF9F27';
  el.style.transition = 'none';
  const card = el.closest('.stat-card');
  if (card) {
    card.classList.remove('card-pulse');
    void card.offsetWidth;
    card.classList.add('card-pulse');
  }
  setTimeout(() => {
    el.textContent = origText;
    el.style.color = '';
    if (card) card.classList.remove('card-pulse');
  }, 650);
}

function levelUp() {
  state.level++;
  state.xp -= state.xpNext;
  state.xpNext = Math.floor(state.xpNext * 1.4);
  const hpUp = rand(5, 10), atkUp = rand(1, 3);
  state.maxHp += hpUp;
  state.hp = Math.min(state.maxHp, state.hp + hpUp);
  state.atk += atkUp;
  log(`✨ 레벨 업! Lv.${state.level} — HP+${hpUp}, 공격+${atkUp}`, 'rebirth');

  // 스탯 카드 펄스
  setTimeout(() => {
    pulseCard('stat-lv',  `▲ ${state.level}`, state.level);
    pulseCard('stat-atk', `▲ +${atkUp}`, state.atk);
    pulseCard('stat-stage', `▲ HP+${hpUp}`, document.getElementById('stat-stage').textContent);
  }, 50);

  // 화면 플래시
  const game = document.getElementById('game');
  game.classList.remove('level-flash');
  void game.offsetWidth;
  game.classList.add('level-flash');
  setTimeout(() => game.classList.remove('level-flash'), 700);
}

function pickRebirthRace(boss) {
  const weights = boss.rebirthWeights;
  const total = weights.reduce((s,w) => s + w.w, 0);
  let r = rand(1, total);
  for (const w of weights) {
    r -= w.w;
    if (r <= 0) return RACES.findIndex(rc => rc.id === w.id);
  }
  return 0;
}

function fightBoss() {
  if (state.cleared) return;
  if(state.dead && !state.bossOnly) return;
  if(combat) return;
  const race = RACES[state.raceIdx];
  const boss = BOSSES[state.bossStage];
  if (!boss) return;
  state.restLeft = hasTrait('homebody') ? MAX_REST * 2 : (RACES[state.raceIdx].id === 'elf' ? 3 : MAX_REST);
  state.hpFloor = false;
  state.bossOnly = false;
  if (state.hp <= 0) state.hp = 1;

  const bossMaxHp = boss.hp;

  beginCombat({
    isBoss: true,
    boss,
    bossMaxHp,
    enemyHp: bossMaxHp,
    maxEnemyHp: bossMaxHp,
    m: { name: boss.name, type: '물리', tier: 10, traits: [boss.special] },
    baseXp: 0,
    defending: false,
    stunned: false,
    cursed: false,
    frozen: false,
    poisonTurns: 0,
    fearTurns: 0,
    spiritShield: false,
    spiritShieldTurns: 0,
    elfCharged: false,
    skillCooldown: 0,
    warnNextTurn: false,
    rounds: 0,
  });

  log(``, '');
  logDivider();
  log(`${boss.icon} ${boss.name} — ${boss.area}`, 'highlight');
  log(`  ${boss.desc}`, 'system');
  log(`  특수기: ${boss.special} — ${boss.specialDesc}`, 'system');

  setCombatUI(true);
  updateCombatBar();
  updateUI();
}


function gameOver(race, boss) {
  state.bossOnly = true;
  state.hp = 0;
  updateUI();
  log('', '');
  log(`💀 ${race.name}이(가) 쓰러졌다.`, 'danger');
  document.getElementById('btn-restart').style.display = 'block';
}

function die(race, boss) {
  state.dead = true;
  log(boss.deathMsg, 'danger');
  log(boss.deathEffect, 'system');
  updateUI();
  setTimeout(() => rebirth(boss), 2200);
}

function restartGame() {
  const r = RACES[0];
  state.raceIdx = 0; state.level = 1;
  state.bossStage = 0; state.reborn = 0;
  state.dead = false; state.bossOnly = false; state.hpFloor = false; state.undyingUsed = false; state.cleared = false; combat = null; setCombatUI && setCombatUI(false);
  // 새 특성 부여
  const newTrait = pickTrait();
  state.traits = [newTrait];
  const isHomebody = newTrait.id === 'homebody';
  const isSturdy   = newTrait.id === 'sturdy';
  state.restLeft = isHomebody ? MAX_REST * 2 : MAX_REST;
  state.maxHp = isSturdy ? Math.floor(r.hp * 1.5) : r.hp;
  state.hp = state.maxHp;
  state.atk = r.atk; state.xp = 0; state.xpNext = 30;
  document.getElementById('btn-restart').style.display = 'none';
  const logEl = document.getElementById('log');
  logEl.innerHTML = '';
  log('▶ 새로운 생이 시작되었다...', 'system');
  if (state.traits && state.traits[0]) log(`  ✨ 공용 특성 부여: ${state.traits.map(t=>t.icon+' '+t.name).join(', ')}`, 'rebirth');
  updateUI();
}

function rebirth(boss) {
  const nextIdx = pickRebirthRace(boss);
  const next = RACES[nextIdx];

  // 이전 레벨 절반 계승 (최소 1)
  const inheritLv = Math.max(1, Math.floor(state.level / 2));
  const prevLv = state.level;

  state.raceIdx = nextIdx;
  state.reborn++;

  // 계승 레벨만큼 스탯 적용
  const hpGainPerLv = 7;
  const atkGainPerLv = 2;
  const baseHp = next.hp + (inheritLv - 1) * hpGainPerLv;
  const baseAtk = next.atk + (inheritLv - 1) * atkGainPerLv;

  state.level = inheritLv;
  state.maxHp = hasTrait('sturdy') ? Math.floor(baseHp * 1.5) : baseHp;
  state.hp = state.maxHp;
  state.atk = baseAtk;

  // xpNext를 계승 레벨에 맞게 조정
  let xpNext = 30;
  for (let i = 1; i < inheritLv; i++) xpNext = Math.floor(xpNext * 1.4);
  state.xp = 0; state.xpNext = xpNext;

  state.dead = false; state.bossOnly = false;
  state.restLeft = hasTrait('homebody') ? MAX_REST * 2 : (next.id === 'elf' ? 3 : MAX_REST);
  state.hpFloor = false; state.undyingUsed = false;

  log(`✦ 환생 #${state.reborn} — ${next.icon} ${next.name}(으)로 다시 태어났다!`, 'rebirth');
  log(`  전생 Lv.${prevLv} → 절반 계승 Lv.${inheritLv} (HP:${state.maxHp} ATK:${state.atk})`, 'system');
  log(`  "${next.desc}"`, 'system');
  log(`  현재 도전 중: ${boss.icon} ${boss.area} — ${boss.name}`, 'system');
  updateUI();
}

function instantKillBoss() {
  if (!DEV_MODE || state.cleared) return;
  const boss = BOSSES[state.bossStage];
  if (!boss) return;
  if (combat && !combat.isBoss) {
    log('☠️ 디버그 즉시킬은 보스에게만 사용할 수 있다.', 'system');
    return;
  }
  if (combat?.isBoss) {
    combat.enemyHp = 0;
    updateCombatBar();
    log(`☠️ DEV: ${combat.boss.name} 즉시 처치`, 'system');
    endCombat(true);
    return;
  }
  beginCombat({
    isBoss: true,
    boss,
    bossMaxHp: boss.hp,
    enemyHp: 0,
    maxEnemyHp: boss.hp,
    m: { name: boss.name, type: '물리', tier: 10, traits: [boss.special] },
    baseXp: 0,
  });
  log(`☠️ DEV: ${boss.name} 즉시 처치`, 'system');
  endCombat(true);
}

function skipStage() {
  if (!DEV_MODE || state.cleared || combat) return;
  if (state.bossStage < BOSSES.length - 1) {
    state.bossStage++;
    const boss = BOSSES[state.bossStage];
    log(`⏭ 스테이지 스킵 → ${boss.icon} ${boss.area}`, 'system');
    updateUI();
  } else {
    log('마지막 스테이지입니다.', 'system');
  }
}

function showInfo() {
  state.showingInfo = true;
  const el = document.getElementById('log');
  el.innerHTML = '';
  log('── 종족 일람 ──', 'highlight');
  RACES.forEach(r => {
    log(`  ${r.icon} ${r.name}  HP:${r.hp} ATK:${r.atk}`, 'highlight');
    log(`    특성: ${r.traits}`, 'system');
    log(`    스킬: ${r.skill.icon} ${r.skill.name} — ${r.skill.desc} (쿨타임: ${r.id === 'spirit' ? 5 : r.id === 'elf' ? 6 : 3}턴)`, 'system');
  });
  log('── 스테이지 현황 ──', 'highlight');
  BOSSES.forEach((b,i) => {
    const done = i < state.bossStage ? '✅' : i === state.bossStage ? '▶' : '🔒';
    log(`  ${done} ${b.icon} ${b.stage}스테이지 ${b.area} — ${b.name}`, 'system');
  });
  log('── 사선 보너스 ──', 'highlight');
  log('  HP 50% 이하 → x1.5 / 25% 이하 → x2.0 / 10% 이하 → x3.0 🔥', 'system');
  state.showingInfo = false;
}

// 게임 시작 시 특성 부여
const initTrait = pickTrait();
state.traits = [initTrait];
if (initTrait.id === 'homebody') state.restLeft = MAX_REST * 2;
if (initTrait.id === 'sturdy') { state.maxHp = Math.floor(state.maxHp * 1.5); state.hp = state.maxHp; }
updateUI();
// 초기 로그에 특성 표시
setTimeout(() => {
  if (state.traits && state.traits[0]) log(`  ✨ 공용 특성 부여: ${state.traits.map(t=>t.icon+' '+t.name).join(', ')}`, 'rebirth');
}, 50);
</script>
</body>
</html>
