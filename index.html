<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f0; display: flex; justify-content: center; padding: 1rem; }
  #game { max-width: 480px; width: 100%; }
  #log { background: #f0ede6; border: 1px solid #ddd; border-radius: 12px; padding: 1rem; height: 220px; overflow-y: auto; font-size: 13px; line-height: 1.7; color: #666; margin-bottom: 1rem; }
  #log p { margin-bottom: 4px; }
  #log p.highlight { color: #222; font-weight: 500; }
  #log p.danger { color: #E24B4A; }
  #log p.rebirth { color: #1D9E75; font-weight: 500; }
  #log p.system { color: #7F77DD; font-style: italic; }
  #log p.bonus { color: #BA7517; font-weight: 500; }
  #status { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
  .stat-card { background: #f0ede6; border-radius: 8px; padding: 10px 12px; text-align: center; }
  .stat-label { font-size: 11px; color: #888; margin-bottom: 4px; }
  .stat-value { font-size: 18px; font-weight: 500; color: #222; }
  #race-banner { border-radius: 12px; padding: 12px 16px; margin-bottom: 1rem; display: flex; align-items: center; gap: 12px; border: 1px solid #ddd; background: #fff; }
  .race-icon { font-size: 32px; }
  .race-info .race-name { font-size: 16px; font-weight: 500; color: #222; display: flex; align-items: center; gap: 8px; }
  .race-info .race-desc { font-size: 12px; color: #888; margin-top: 2px; }
  #bonus-badge { display: none; background: #FAEEDA; color: #854F0B; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 6px; }
  .bar-wrap { margin-bottom: 1rem; }
  .bar-label { font-size: 12px; color: #888; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .bar-bg { height: 10px; background: #e8e5de; border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s, background 0.3s; }
  #actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { cursor: pointer; border-radius: 8px; border: 1px solid #ccc; background: #fff; color: #222; font-size: 13px; padding: 10px 8px; font-family: inherit; transition: background 0.15s; }
  button:hover { background: #f0ede6; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.4; cursor: default; }
  @keyframes floatUp {
    0%   { opacity:1; transform: translateY(0); }
    100% { opacity:0; transform: translateY(-40px); }
  }
  @keyframes flashGold {
    0%   { background: rgba(239,159,39,0); }
    30%  { background: rgba(239,159,39,0.25); }
    100% { background: rgba(239,159,39,0); }
  }
  .float-label {
    position:absolute; font-size:13px; font-weight:500; color:#EF9F27;
    pointer-events:none; animation: floatUp 0.9s ease-out forwards;
    white-space:nowrap; z-index:99;
  }
  .level-flash { animation: flashGold 0.7s ease-out forwards; }
  #combat-panel { display:none; background:#fff; border:0.5px solid #ddd; border-radius:12px; padding:12px; margin-bottom:10px; }
  #combat-panel .enemy-name { font-size:15px; font-weight:500; color:#222; margin-bottom:6px; }
  #combat-panel .bars { margin-bottom:8px; }
  #combat-panel .bar-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; font-size:12px; color:#888; }
  #combat-panel .mini-bar { flex:1; height:8px; background:#e8e5de; border-radius:999px; overflow:hidden; }
  #combat-panel .mini-fill { height:100%; border-radius:999px; transition:width 0.3s; }
  #combat-actions { display:none; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:8px; }
  #combat-actions button { padding:10px 4px; font-size:12px; }
  .warn-banner { background:#FAEEDA; color:#854F0B; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:500; margin-bottom:6px; display:none; }
</style>
</head>
<body>
<div id="game" style="position:relative;">
  <div id="race-banner">
    <div class="race-icon" id="race-icon">🧑</div>
    <div class="race-info">
      <div class="race-name"><span id="race-name-text">인간</span> <span id="bonus-badge"></span></div>
      <div class="race-desc" id="race-desc">균형잡힌 전사. 강인한 의지를 지녔다.</div>
    </div>
  </div>

  <div id="trait-banner" style="display:none; margin-bottom:8px; padding:8px 12px; border-radius:8px; border:0.5px solid #ccc; background:#fff; font-size:12px; display:flex; align-items:center; gap:8px;">
    <span id="trait-icon" style="font-size:18px;"></span>
    <div><div id="trait-name" style="font-weight:500; color:#222;"></div><div id="trait-desc" style="color:#888; font-size:11px;"></div></div>
  </div>
  <div id="status" style="grid-template-columns:1fr 1fr 1fr 1fr;">
    <div class="stat-card"><div class="stat-label">레벨</div><div class="stat-value" id="stat-lv">1</div></div>
    <div class="stat-card"><div class="stat-label">공격력</div><div class="stat-value" id="stat-atk">10</div></div>
    <div class="stat-card"><div class="stat-label">스테이지</div><div class="stat-value" id="stat-stage">1</div></div>
    <div class="stat-card"><div class="stat-label">환생 횟수</div><div class="stat-value" id="stat-reborn">0</div></div>
  </div>

  <div class="bar-wrap">
    <div class="bar-label"><span>HP</span><span id="hp-text">30 / 30</span></div>
    <div class="bar-bg"><div class="bar-fill" id="hp-bar" style="width:100%; background:#1D9E75;"></div></div>
  </div>

  <div class="bar-wrap">
    <div class="bar-label"><span>경험치</span><span id="xp-text">0 / 30</span></div>
    <div class="bar-bg"><div class="bar-fill" id="xp-bar" style="width:0%; background:#7F77DD;"></div></div>
  </div>

  <div id="log">
    <p class="system">▶ 새로운 생이 시작되었다...</p>
    <p class="system">  💡 체력 낮을수록 경험치 보너스 / 보스 처치 시 다음 스테이지로!</p>
  </div>

  <div id="combat-panel">
    <div class="enemy-name" id="combat-enemy-name"></div>
    <div id="warn-banner" class="warn-banner">⚠️ 강공격 예고! 이번 턴 방어하지 않으면 큰 피해!</div>
    <div class="bars">
      <div class="bar-row"><span id="enemy-hp-label">적 HP</span><div class="mini-bar"><div class="mini-fill" id="enemy-hp-fill" style="background:#E24B4A;width:100%;"></div></div><span id="enemy-hp-num"></span></div>
    </div>
    <div id="combat-actions">
      <button onclick="combatAction('attack')">⚔️ 공격</button>
      <button onclick="combatAction('defend')">🛡️ 방어</button>
      <button id="btn-skill" onclick="combatAction('skill')">✨ 스킬</button>
    </div>
  </div>
  <div id="actions">
    <button id="btn-hunt" onclick="startHunt()">⚔️ 사냥하기</button>
    <button id="btn-rest" onclick="rest()">🛌 휴식하기 (5/5)</button>
    <button id="btn-boss" onclick="fightBoss()">💀 보스 도전</button>
    <button onclick="showInfo()">📖 종족 정보</button>
  </div>
  <button id="btn-restart" onclick="restartGame()" style="display:none; width:100%; margin-top:10px; padding:12px; background:#E24B4A; color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer;">↺ 다시 시작</button>
</div>

function pickMonster(playerLevel) {
  const maxTier = Math.min(10, Math.max(1, Math.floor(playerLevel * 0.8) + rand(0, 2)));
  const pool = MONSTERS.filter(m => m.tier <= maxTier);
  return pool[rand(0, pool.length - 1)];
}

function pickTrait() {
  return TRAITS[rand(0, TRAITS.length - 1)];
}

let state = { raceIdx:0, level:1, hp:30, maxHp:30, atk:10, xp:0, xpNext:30, reborn:0, dead:false, bossOnly:false, restLeft:MAX_REST, bossStage:0, hpFloor:false, trait:null, undyingUsed:false };
let combat = null; // 현재 전투 상태

function getBonusTier(hp, maxHp) {
  const pct = hp / maxHp;
  if (pct <= 0.10) return { label:'사선 돌파!!', mult:3.0, color:'#E24B4A' };
  if (pct <= 0.25) return { label:'위험 보너스!', mult:2.0, color:'#EF9F27' };
  if (pct <= 0.50) return { label:'아슬 보너스', mult:1.5, color:'#BA7517' };
  return null;
}

function log(msg, cls='') {
  const el = document.getElementById('log');
  const p = document.createElement('p');
  if(cls) p.className = cls;
  p.textContent = msg;
  el.appendChild(p);
  el.scrollTop = el.scrollHeight;
}

function updateUI() {
  const r = RACES[state.raceIdx];
  document.getElementById('race-icon').textContent = r.icon;
  document.getElementById('race-desc').textContent = r.desc;
  document.getElementById('race-name-text').textContent = r.name;
  document.getElementById('stat-lv').textContent = state.level;
  document.getElementById('stat-atk').textContent = state.atk;
  document.getElementById('stat-reborn').textContent = state.reborn;
  const tb = document.getElementById('trait-banner');
  if (state.trait && tb) {
    tb.style.display = 'flex';
    document.getElementById('trait-icon').textContent = state.trait.icon;
    document.getElementById('trait-name').textContent = state.trait.name;
    document.getElementById('trait-desc').textContent = state.trait.desc;
  }
  const bs = BOSSES[state.bossStage];
  document.getElementById('stat-stage').textContent = bs ? `${bs.icon}${bs.stage}` : '완';
  document.getElementById('hp-text').textContent = state.hp + ' / ' + state.maxHp;
  document.getElementById('xp-text').textContent = state.xp + ' / ' + state.xpNext;

  const hpPct = Math.max(0, state.hp / state.maxHp * 100);
  const hpBar = document.getElementById('hp-bar');
  hpBar.style.width = hpPct + '%';

  const tier = getBonusTier(state.hp, state.maxHp);
  const badge = document.getElementById('bonus-badge');
  if (tier) {
    hpBar.style.background = tier.color;
    badge.style.display = 'inline-block';
    badge.textContent = 'x' + tier.mult + ' 보너스 중';
  } else {
    hpBar.style.background = hpPct > 50 ? '#1D9E75' : '#EF9F27';
    badge.style.display = 'none';
  }

  document.getElementById('xp-bar').style.width = (state.xp / state.xpNext * 100) + '%';

  const restBtn = document.getElementById('btn-rest');
  if (restBtn) {
    restBtn.textContent = `🛌 휴식하기 (${state.restLeft}/${MAX_REST})`;
    restBtn.disabled = state.dead || state.restLeft <= 0;
  }
  const bossBtn = document.getElementById('btn-boss');
  if (bossBtn && bs) {
    bossBtn.textContent = `${bs.icon} ${bs.name} 도전`;
  }
  const huntBtn = document.getElementById('btn-hunt');
  if (huntBtn) {
    huntBtn.disabled = state.dead || state.hpFloor || state.bossOnly || !!combat;
    huntBtn.textContent = state.bossOnly ? '⚔️ 사냥 불가 (사망)' : state.hpFloor ? '⚔️ 사냥 불가 (HP 바닥)' : '⚔️ 사냥하기';
  }
  const restBtnEl = document.getElementById('btn-rest');
  if (restBtnEl) restBtnEl.disabled = state.dead || state.restLeft <= 0 || state.bossOnly;
  if (bossBtn && bs) bossBtn.disabled = state.dead || state.bossOnly;
}

function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

function applyXP(base) {
  const tier = getBonusTier(state.hp, state.maxHp);
  let final = base;
  if (tier) {
    final = Math.round(base * tier.mult);
    log(`  🔥 ${tier.label} — 경험치 x${tier.mult} → +${final}xp!`, 'bonus');
  } else {
    log(`  → 경험치 +${final}`);
  }
  if (state.trait?.id === 'growth') {
    final = Math.floor(final * 1.5);
    log(`  🌱 빠른 성장 — 경험치 +50% → 총 ${final}xp`, 'system');
  }
  state.xp += final;
  if (state.xp >= state.xpNext) levelUp();
}

function getEarthDefense() {
  const pct = state.hp / state.maxHp;
  if (pct <= 0.10) return 12;
  if (pct <= 0.25) return 7;
  if (pct <= 0.50) return 3;
  return 0;
}

function calcMyAtk(baseAtk, m) {
  const race = RACES[state.raceIdx];
  let atk = baseAtk;
  if (race.canMagic && m.type === '마법') atk = Math.floor(atk * 1.4);
  if (state.trait?.id === 'berserk' && state.hp / state.maxHp <= 0.3) atk = Math.floor(atk * 1.3);
  if (state.trait?.id === 'instinct' && m.type === '물리') atk = Math.floor(atk * 1.25);
  if (state.trait?.id === 'magic' && m.type === '마법') atk = Math.floor(atk * 1.15);
  const critChance = 0.1 + (state.trait?.id === 'lucky' ? 0.15 : 0);
  const isCrit = Math.random() < critChance;
  if (isCrit) { atk *= 2; }
  // 엘프 마법 집중 충전
  if (combat?.elfCharged) { atk *= 3; combat.elfCharged = false; }
  return { atk, isCrit };
}

function calcEnemyAtk(m) {
  const race = RACES[state.raceIdx];
  let dmg = Math.max(1, m.atk + rand(0, 4) + Math.floor(state.level * 0.5) - (m.def || 0));
  if (race.physResist && m.type === '물리') dmg = Math.max(1, Math.floor(dmg * 0.6));
  if (race.magicWeak && m.type === '마법') dmg = Math.floor(dmg * 1.5);
  if (race.earthDefense) dmg = Math.max(1, dmg - getEarthDefense());
  if (state.trait?.id === 'instinct' && m.type === '물리') dmg = Math.floor(dmg * 1.1);
  if (combat?.defending) dmg = Math.floor(dmg * 0.5);
  if (combat?.spiritShield) dmg = Math.floor(dmg * 0.4);
  if (combat?.fearTurns > 0) dmg = Math.floor(dmg * 0.8);
  return dmg;
}

function startHunt() {
  if (state.dead || state.bossOnly || combat) return;
  const m = pickMonster(state.level);
  const race = RACES[state.raceIdx];
  const maxEnemyHp = (m.atk * 4) + (m.tier * 8) + state.level * 3;
  combat = {
    m, maxEnemyHp, enemyHp: maxEnemyHp,
    baseXp: (m.tier * 4) + rand(3, 8) + state.level,
    defending: false, stunned: false,
    poisonTurns: 0, fearTurns: 0,
    spiritShield: false, spiritShieldTurns: 0,
    elfCharged: false, skillCooldown: 0,
    warnNextTurn: false
  };
  const typeIcon = m.type === '물리' ? '⚔️' : '✨';
  log(`${typeIcon} [${m.type} Tier${m.tier}] ${m.name} 출현! — ${m.desc}`, 'highlight');
  log(`  특성: ${m.traits.join(', ')}  |  적 HP: ${maxEnemyHp}`);
  log(`  스킬: ${race.skill.icon} ${race.skill.name} — ${race.skill.desc}`, 'system');
  setCombatUI(true);
  updateCombatBar();
}

function setCombatUI(active) {
  document.getElementById('combat-panel').style.display = active ? 'block' : 'none';
  document.getElementById('combat-actions').style.display = active ? 'grid' : 'none';
  document.getElementById('actions').style.display = active ? 'none' : 'grid';
  if (active) {
    const race = RACES[state.raceIdx];
    document.getElementById('combat-enemy-name').textContent =
      `${combat.m.type === '물리' ? '⚔️' : '✨'} ${combat.m.name}`;
    updateSkillBtn();
  }
}

function updateSkillBtn() {
  if (!combat) return;
  const race = RACES[state.raceIdx];
  const btn = document.getElementById('btn-skill');
  if (!btn) return;
  if (combat.skillCooldown > 0) {
    btn.textContent = `⏳ ${race.skill.name} (${combat.skillCooldown}턴)`;
    btn.disabled = true;
  } else {
    btn.textContent = `${race.skill.icon} ${race.skill.name}`;
    btn.disabled = false;
  }
}

function updateCombatBar() {
  if (!combat) return;
  const pct = Math.max(0, combat.enemyHp / combat.maxEnemyHp * 100);
  document.getElementById('enemy-hp-fill').style.width = pct + '%';
  document.getElementById('enemy-hp-num').textContent = combat.enemyHp + '/' + combat.maxEnemyHp;
  const warn = document.getElementById('warn-banner');
  warn.style.display = combat.warnNextTurn ? 'block' : 'none';
}

function combatAction(action) {
  if (!combat || state.dead) return;
  const m = combat.m;
  const race = RACES[state.raceIdx];
  combat.defending = false;

  // ── 내 행동 ──
  if (action === 'attack') {
    const base = state.atk + rand(0, 5);
    const { atk, isCrit } = calcMyAtk(base, m);
    combat.enemyHp = Math.max(0, combat.enemyHp - atk);
    let msg = `  ⚔️ 공격 ${atk}${isCrit ? ' 💥치명타!' : ''}`;
    if (state.trait?.id === 'vampire') {
      const leech = Math.floor(atk * 0.3);
      state.hp = Math.min(state.maxHp, state.hp + leech);
      msg += ` 🩸+${leech}`;
    }
    log(msg);
  } else if (action === 'defend') {
    combat.defending = true;
    log(`  🛡️ 방어 태세`);
  } else if (action === 'skill') {
    if (combat.skillCooldown > 0) {
      log(`  ⏳ 스킬 쿨타임 중 (${combat.skillCooldown}턴 남음)`, 'system');
      return;
    }
    combat.skillCooldown = 3;
    const id = race.id;
    if (id === 'human') {
      const h1 = Math.floor((state.atk + rand(0,5)) * 0.8);
      const h2 = Math.floor((state.atk + rand(0,5)) * 0.8);
      combat.enemyHp = Math.max(0, combat.enemyHp - h1 - h2);
      log(`  ⚔️⚔️ 연속 공격! ${h1} + ${h2} = ${h1+h2} 데미지`);
    } else if (id === 'skeleton') {
      combat.fearTurns = 2;
      log(`  💀 공포! 적 공격력 2턴 20% 감소`, 'system');
    } else if (id === 'poop') {
      combat.poisonTurns = 3;
      log(`  ☠️ 독액! 3턴 지속 피해 시작`, 'system');
    } else if (id === 'spirit') {
      combat.spiritShield = true;
      combat.spiritShieldTurns = 3;
      log(`  🌿 대지 방벽! 3턴 피해 60% 감소`, 'system');
    } else if (id === 'elf') {
      combat.elfCharged = true;
      log(`  🔮 마법 집중 충전! 다음 공격 3배`, 'system');
    }
  }

  if (combat.enemyHp <= 0) { endCombat(true); return; }

  // ── 방어 자세 무너뜨리기 ──
  if (action === 'defend' && Math.random() < 0.2) {
    combat.stunned = true;
    log(`  💥 자세 무너뜨리기! 다음 턴 적 행동 불가`, 'rebirth');
  }

  // ── 적 행동 ──
  if (combat.stunned) {
    log(`  💤 적이 비틀거린다... (행동 불가)`);
    combat.stunned = false;
  } else {
    // 강공격 예고 (20% 확률, Tier 4 이상)
    const bigAttackWarned = combat.warnNextTurn;
    combat.warnNextTurn = m.tier >= 4 && Math.random() < 0.2;

    let dmg = calcEnemyAtk(m);
    if (bigAttackWarned) dmg = Math.floor(dmg * 2.5);

    // 엘프 회피
    if (race.canDodge && Math.random() < 0.5) {
      log(`  💨 회피! 피해 없음`);
      dmg = 0;
    }

    if (dmg > 0) {
      state.hp = Math.max(0, state.hp - dmg);
      const defended = action === 'defend';
      log(`  ${bigAttackWarned ? '💥 강공격!' : '적 공격'} ${dmg}${defended ? ' (방어 50%감소)' : ''}`, bigAttackWarned ? 'danger' : '');
    }
  }

  // 스킬 쿨타임 감소
  if (combat.skillCooldown > 0) {
    combat.skillCooldown--;
    if (combat.skillCooldown === 0) log(`  ✅ 스킬 사용 가능!`, 'system');
  }
  updateSkillBtn();

  // 독 피해
  if (combat.poisonTurns > 0) {
    const poisonDmg = Math.floor(combat.maxEnemyHp * 0.05);
    combat.enemyHp = Math.max(0, combat.enemyHp - poisonDmg);
    combat.poisonTurns--;
    log(`  ☠️ 독 피해 ${poisonDmg} (남은 턴: ${combat.poisonTurns})`);
  }
  // 공포 턴 감소
  if (combat.fearTurns > 0) combat.fearTurns--;
  // 방벽 턴 감소
  if (combat.spiritShield) {
    combat.spiritShieldTurns--;
    if (combat.spiritShieldTurns <= 0) { combat.spiritShield = false; log(`  🌿 방벽 해제`); }
  }

  log(`  HP ${state.hp}/${state.maxHp} | 적 HP ${combat.enemyHp}/${combat.maxEnemyHp}`);
  updateCombatBar();
  updateUI();

  if (combat.enemyHp <= 0) { endCombat(true); return; }
  if (state.hp <= 0) { endCombat(false); return; }
}

function endCombat(victory) {
  const m = combat.m;
  const baseXp = combat.baseXp;
  combat = null;
  setCombatUI(false);
  const skillBtn = document.getElementById('btn-skill');
  if (skillBtn) { skillBtn.disabled = false; }
  if (victory) {
    log(`  ✅ ${m.name} 처치!`, 'rebirth');
    applyXP(baseXp);
  } else {
    log(`☠️ 전투 중 사망!`, 'danger');
    updateUI();
    const race = RACES[state.raceIdx];
    const boss = BOSSES[state.bossStage];
    setTimeout(() => gameOver(race, boss), 400);
    return;
  }
  const hpPct = state.hp / state.maxHp;
  if (hpPct <= 0.10) log(`  ☠️ 위험! 보스 도전 시 경험치 x3.0!`, 'danger');
  else if (hpPct <= 0.25) log(`  ⚠️ 보스 도전 시 경험치 x2.0!`, 'danger');
  else if (hpPct <= 0.50) log(`  💡 보스 도전 시 경험치 x1.5`);
  updateUI();
}

function rest() {
  if(state.dead || state.restLeft <= 0) return;
  const race = RACES[state.raceIdx];
  state.restLeft--;
  if(state.hpFloor) log('  💊 회복 후에도 보스 도전만 가능하다.', 'system');
  if (race.fullRestoreOnce) {
    const healed = state.maxHp - state.hp;
    state.hp = state.maxHp;
    log(`🛌 💩 풀회복 특성 발동! HP +${healed} → 완전 회복! (${state.hp}/${state.maxHp})  남은 휴식 ${state.restLeft}회`, 'rebirth');
  } else {
    const baseHeal = Math.floor(state.maxHp * 0.3);
    const bigRest = Math.random() < 0.2;
    const heal = bigRest ? baseHeal * 3 : baseHeal;
    state.hp = Math.min(state.maxHp, state.hp + heal);
    if (bigRest)
      log(`🛌 ✨ 깊은 휴식! HP +${heal} 회복 (최대HP의 90%). (${state.hp}/${state.maxHp})  남은 휴식 ${state.restLeft}회`, 'rebirth');
    else
      log(`🛌 휴식... HP +${heal} 회복 (최대HP의 30%). (${state.hp}/${state.maxHp})  남은 휴식 ${state.restLeft}회`);
  }
  if(state.restLeft === 0) log('  ⚠️ 휴식 횟수 소진! 보스를 도전해야 초기화된다.', 'danger');
  updateUI();
}

function spawnFloat(anchorId, text) {
  const anchor = document.getElementById(anchorId);
  if (!anchor) return;
  const rect = anchor.getBoundingClientRect();
  const gameRect = document.getElementById('game').getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'float-label';
  el.textContent = text;
  el.style.left = (rect.left - gameRect.left + rect.width / 2) + 'px';
  el.style.top  = (rect.top  - gameRect.top) + 'px';
  document.getElementById('game').appendChild(el);
  setTimeout(() => el.remove(), 950);
}

function levelUp() {
  state.level++;
  state.xp -= state.xpNext;
  state.xpNext = Math.floor(state.xpNext * 1.4);
  const hpUp = rand(5, 10), atkUp = rand(1, 3);
  state.maxHp += hpUp;
  state.hp = Math.min(state.maxHp, state.hp + hpUp);
  state.atk += atkUp;
  log(`✨ 레벨 업! Lv.${state.level} — HP+${hpUp}, 공격+${atkUp}`, 'rebirth');

  // 화살표 애니메이션
  setTimeout(() => {
    spawnFloat('stat-atk', `▲ +${atkUp}`);
    spawnFloat('stat-lv',  `▲ Lv.${state.level}`);
    // HP바 위에도
    spawnFloat('hp-text',  `▲ +${hpUp}`);
  }, 50);

  // 화면 플래시
  const game = document.getElementById('game');
  game.classList.remove('level-flash');
  void game.offsetWidth;
  game.classList.add('level-flash');
  setTimeout(() => game.classList.remove('level-flash'), 700);
}

function pickRebirthRace(boss) {
  const weights = boss.rebirthWeights;
  const total = weights.reduce((s,w) => s + w.w, 0);
  let r = rand(1, total);
  for (const w of weights) {
    r -= w.w;
    if (r <= 0) return RACES.findIndex(rc => rc.id === w.id);
  }
  return 0;
}

function fightBoss() {
  if(state.dead && !state.bossOnly) return;
  const race = RACES[state.raceIdx];
  const boss = BOSSES[state.bossStage];
  const bossMaxHp = boss.hp;
  state.restLeft = MAX_REST;
  state.hpFloor = false;
  state.bossOnly = false;
  if (state.hp <= 0) state.hp = 1;

  log(``, '');
  log(`${'━'.repeat(28)}`, 'highlight');
  log(`${boss.icon} ${boss.name} — ${boss.area}`, 'highlight');
  log(`  ${boss.desc}`, 'system');
  log(`  특수기: ${boss.special} / ${boss.specialDesc}`, 'system');
  log(`  보스 HP: ${bossMaxHp}  |  내 HP: ${state.hp}/${state.maxHp}  |  공격력: ${state.atk}`, '');
  log(`${'─'.repeat(28)}`, '');

  let bossHp = bossMaxHp;
  let rounds = 0;
  let stunned = false;
  let cursed = false;
  let frozen = false;
  const myStartHp = state.hp;

  while (bossHp > 0 && state.hp > 0 && rounds < 20) {
    rounds++;
    let roundLog = `  R${String(rounds).padStart(2,'0')} │`;
    let specialNote = '';

    // ── 내 공격 ──
    let myAtk = 0;
    if (frozen) {
      roundLog += ` 나: ❄️빙결(0)`;
      frozen = false;
    } else {
      myAtk = state.atk + rand(0, 8);
      if (cursed) { myAtk = Math.floor(myAtk * 0.8); specialNote += ' 🌙저주중'; }
      if (race.canMagic) myAtk = Math.floor(myAtk * 1.2);

      // 특성: 보스 사냥꾼
      if (state.trait?.id === 'bossKill') myAtk = Math.floor(myAtk * 1.5);
      // 특성: 폭주
      if (state.trait?.id === 'berserk' && state.hp / state.maxHp <= 0.3) myAtk = Math.floor(myAtk * 1.3);
      // 특성: 전투 본능 (보스는 물리형)
      if (state.trait?.id === 'instinct') myAtk = Math.floor(myAtk * 1.25);
      // 치명타
      const critChance = 0.1 + (state.trait?.id === 'lucky' ? 0.15 : 0);
      const crit = Math.random() < critChance;
      if (crit) { myAtk *= 2; specialNote += ' 💥치명타'; }

      if (boss.stage === 2 && Math.random() < 0.5) {
        roundLog += ` 나: ${myAtk}→🌊분신(무효)`;
        myAtk = 0;
      } else {
        bossHp = Math.max(0, bossHp - myAtk);
        roundLog += ` 나: ${myAtk}`;
        // 특성: 흡혈
        if (state.trait?.id === 'vampire' && myAtk > 0) {
          const leech = Math.floor(myAtk * 0.3);
          state.hp = Math.min(state.maxHp, state.hp + leech);
          if (leech > 0) specialNote += ` 🩸+${leech}`;
        }
      }
    }

    if (bossHp <= 0) {
      log(roundLog + ` │ 보스HP: 0 ← 격퇴!`, 'rebirth');
      break;
    }

    // ── 보스 공격 ──
    let bossAtk = boss.atk + rand(0, 10);
    let bossAtkNote = '';

    if (boss.stage === 1 && bossHp < bossMaxHp * 0.3) {
      bossAtk = Math.floor(bossAtk * 1.5); bossAtkNote = '🔴광폭화';
    }
    if (boss.stage === 3 && Math.random() < 0.3) {
      bossAtk = Math.floor(state.maxHp * 0.3); bossAtkNote = '⛰내려찍기';
    }
    if (boss.stage === 4) {
      const burn = Math.floor(state.maxHp * 0.05);
      bossAtk += burn; bossAtkNote = `🔥장판+${burn}`;
    }
    if (boss.stage === 5 && Math.random() < 0.4) {
      cursed = true; bossAtkNote = '🌙저주';
    }
    if (boss.stage === 6 && Math.random() < 0.3) {
      stunned = true; bossAtkNote = '⚡낙뢰스턴';
    }
    if (boss.stage === 7 && Math.random() < 0.4) {
      frozen = true; bossAtkNote = '❄️빙결예고';
    }
    if (boss.stage === 8) {
      const leech = Math.floor(bossAtk * 0.5);
      bossHp = Math.min(bossMaxHp, bossHp + leech);
      bossAtkNote = `☠️흡혈+${leech}`;
    }
    if (boss.stage === 9 && Math.random() < 0.5) {
      bossAtk = Math.floor(bossAtk * 1.5); bossAtkNote = '🌌레이저';
    }

    // 종족 방어
    let defNote = '';
    if (state.trait?.id === 'instinct') { bossAtk = Math.floor(bossAtk * 1.1); defNote = '⚔️본능'; }
    if (race.physResist) { bossAtk = Math.max(1, Math.floor(bossAtk * 0.6)); defNote += '🛡내성'; }
    if (race.earthDefense) {
      const ed = getEarthDefense();
      if (ed > 0) { bossAtk = Math.max(1, bossAtk - ed); defNote = `🌿방어-${ed}`; }
    }
    if (race.canDodge && Math.random() < 0.5) { bossAtk = 0; defNote = '💨회피'; }
    if (stunned) { stunned = false; bossAtk = Math.floor(bossAtk * 0.5); defNote += '⚡스턴'; }

    state.hp = Math.max(0, state.hp - bossAtk);

    // 특성: 불굴 — 사망 직전 1회 부활
    if (state.hp <= 0 && state.trait?.id === 'undying' && !state.undyingUsed) {
      state.undyingUsed = true;
      state.hp = Math.floor(state.maxHp * 0.3);
      specialNote += ' 🛡️불굴발동!';
    }

    const bossHpBar = Math.round(bossHp / bossMaxHp * 10);
    const myHpBar   = Math.round(state.hp / state.maxHp * 10);
    const bossHpVis = '█'.repeat(bossHpBar) + '░'.repeat(10 - bossHpBar);
    const myHpVis   = '█'.repeat(myHpBar)   + '░'.repeat(10 - myHpBar);

    const bossLabel = bossAtkNote ? ` 보스: ${bossAtk}(${bossAtkNote})` : ` 보스: ${bossAtk}`;
    const defLabel  = defNote ? `[${defNote}]` : '';
    roundLog += bossLabel + defLabel + specialNote;
    roundLog += ` │ 보스[${bossHpVis}]${bossHp} 나[${myHpVis}]${state.hp}`;

    log(roundLog, state.hp <= 0 ? 'danger' : state.hp < state.maxHp * 0.3 ? 'bonus' : '');
  }

  log(`${'─'.repeat(28)}`, '');

  if (bossHp <= 0) {
    const hpLeft = Math.round(state.hp / state.maxHp * 100);
    log(`🏆 ${boss.name} 격퇴! — ${rounds}라운드, 잔여HP ${hpLeft}%`, 'rebirth');
    applyXP(state.xpNext * 3);
    if (state.bossStage < BOSSES.length - 1) {
      state.bossStage++;
      const next = BOSSES[state.bossStage];
      log(`▶ 다음 스테이지: ${next.icon} ${next.area} — ${next.name}`, 'system');
    } else {
      log(`🌟 모든 스테이지 클리어! 전설이 되었다.`, 'rebirth');
    }
  } else {
    state.hp = 0;
    const dmgTaken = myStartHp;
    log(`💀 패배 — ${rounds}라운드 버팀. 보스 잔여HP: ${bossHp}/${bossMaxHp}`, 'danger');
    updateUI();
    setTimeout(() => die(race, boss), 300);
    return;
  }
  updateUI();
}

function gameOver(race, boss) {
  state.bossOnly = true;
  state.hp = 0;
  updateUI();
  log('', '');
  log(`💀 ${race.name}이(가) 쓰러졌다.`, 'danger');
  document.getElementById('btn-restart').style.display = 'block';
}

function die(race, boss) {
  state.dead = true;
  log(boss.deathMsg, 'danger');
  log(boss.deathEffect, 'system');
  updateUI();
  setTimeout(() => rebirth(boss), 2200);
}

function restartGame() {
  const r = RACES[0];
  state.raceIdx = 0; state.level = 1;
  state.bossStage = 0; state.reborn = 0;
  state.dead = false; state.bossOnly = false; state.hpFloor = false; state.undyingUsed = false; combat = null; setCombatUI && setCombatUI(false);
  // 새 특성 부여
  state.trait = pickTrait();
  const isHomebody = state.trait.id === 'homebody';
  const isSturdy   = state.trait.id === 'sturdy';
  state.restLeft = isHomebody ? MAX_REST * 2 : MAX_REST;
  state.maxHp = isSturdy ? Math.floor(r.hp * 1.5) : r.hp;
  state.hp = state.maxHp;
  state.atk = r.atk; state.xp = 0; state.xpNext = 30;
  document.getElementById('btn-restart').style.display = 'none';
  const logEl = document.getElementById('log');
  logEl.innerHTML = '';
  log('▶ 새로운 생이 시작되었다...', 'system');
  log(`  ✨ 공용 특성 부여: ${state.trait.icon} ${state.trait.name} — ${state.trait.desc}`, 'rebirth');
  updateUI();
}

function rebirth(boss) {
  const nextIdx = pickRebirthRace(boss);
  const next = RACES[nextIdx];

  // 이전 레벨 절반 계승 (최소 1)
  const inheritLv = Math.max(1, Math.floor(state.level / 2));
  const prevLv = state.level;

  state.raceIdx = nextIdx;
  state.reborn++;

  // 계승 레벨만큼 스탯 적용
  const hpGainPerLv = 7;
  const atkGainPerLv = 2;
  const baseHp = next.hp + (inheritLv - 1) * hpGainPerLv;
  const baseAtk = next.atk + (inheritLv - 1) * atkGainPerLv;

  state.level = inheritLv;
  state.maxHp = state.trait?.id === 'sturdy' ? Math.floor(baseHp * 1.5) : baseHp;
  state.hp = state.maxHp;
  state.atk = baseAtk;

  // xpNext를 계승 레벨에 맞게 조정
  let xpNext = 30;
  for (let i = 1; i < inheritLv; i++) xpNext = Math.floor(xpNext * 1.4);
  state.xp = 0; state.xpNext = xpNext;

  state.dead = false; state.bossOnly = false;
  state.restLeft = state.trait?.id === 'homebody' ? MAX_REST * 2 : MAX_REST;
  state.hpFloor = false; state.undyingUsed = false;

  log(`✦ 환생 #${state.reborn} — ${next.icon} ${next.name}(으)로 다시 태어났다!`, 'rebirth');
  log(`  전생 Lv.${prevLv} → 절반 계승 Lv.${inheritLv} (HP:${state.maxHp} ATK:${state.atk})`, 'system');
  log(`  "${next.desc}"`, 'system');
  log(`  현재 도전 중: ${boss.icon} ${boss.area} — ${boss.name}`, 'system');
  updateUI();
}

function showInfo() {
  log('── 종족 일람 ──', 'highlight');
  RACES.forEach(r => log(`  ${r.icon} ${r.name}  HP:${r.hp} ATK:${r.atk}  |  ${r.traits}`, 'system'));
  log('── 스테이지 현황 ──', 'highlight');
  BOSSES.forEach((b,i) => {
    const done = i < state.bossStage ? '✅' : i === state.bossStage ? '▶' : '🔒';
    log(`  ${done} ${b.icon} ${b.stage}스테이지 ${b.area} — ${b.name}`, 'system');
  });
  log('── 사선 보너스 ──', 'highlight');
  log('  HP 50% 이하 → x1.5 / 25% 이하 → x2.0 / 10% 이하 → x3.0 🔥', 'system');
}

// 게임 시작 시 특성 부여
state.trait = pickTrait();
if (state.trait.id === 'homebody') state.restLeft = MAX_REST * 2;
if (state.trait.id === 'sturdy') { state.maxHp = Math.floor(state.maxHp * 1.5); state.hp = state.maxHp; }
updateUI();
// 초기 로그에 특성 표시
setTimeout(() => {
  log(`  ✨ 공용 특성 부여: ${state.trait.icon} ${state.trait.name} — ${state.trait.desc}`, 'rebirth');
}, 50);
